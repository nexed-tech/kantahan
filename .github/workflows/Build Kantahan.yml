name: Build Kantahan
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm run pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: Kantahan-Windows
          path: release/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm run pack:mac
      - uses: actions/upload-artifact@v4
        with:
          name: Kantahan-macOS
          path: release/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y libfuse2
      - run: npm install
      - run: npm run build
      - run: npm run pack:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Kantahan-Linux
          path: release/
