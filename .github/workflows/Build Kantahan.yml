name: Build Kantahan
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Package app
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then npm run pack:win; fi
          if [ "$RUNNER_OS" == "macOS" ]; then npm run pack:mac; fi
          if [ "$RUNNER_OS" == "Linux" ]; then npm run pack:linux; fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kantahan-${{ matrix.os }}
          path: release/
